<!DOCTYPE html>
<html>
<head>
    <title>Digital Forensics Evidence Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f4f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #172554;
            color: white;
            padding: 25px;
        }

        .container {
            background-color: white;
            width: 450px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            color: #172554;
        }

        input[type="file"] {
            margin: 20px;
            padding: 10px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .dashboard-btn {
            background-color: #15803d;
            margin-top: 15px;
        }

        .dashboard-btn:hover {
            background-color: #166534;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>Digital Forensics Evidence Analyzer</h1>
    <p>Digital Evidence Analysis and Integrity Verification</p>
</header>

<div class="container">

    <h2>Upload Digital Evidence</h2>

    <p>Select a file to analyze and generate its SHA-256 hash.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file" name="evidence" required>

        <br><br>

        <button type="submit">
            Upload and Analyze
        </button>

    </form>

    <hr>

    <h2>Dashboard</h2>

    <p>View uploaded evidence and integrity status.</p>

    <a href="/dashboard">
        <button type="button" class="dashboard-btn">
            Go to Dashboard
        </button>
    </a>

</div>

</body>
</html>
