<!DOCTYPE html>
<html>
<head>
    <title>Chain of Custody</title>
</head>
<body>

    <h1>Chain of Custody Records</h1>

    <h3>Evidence ID: {{ evidence_id }}</h3>

    <hr>

    {% if records %}

    <table border="1" cellpadding="10">
        <tr>
            <th>Action</th>
            <th>Person</th>
            <th>Timestamp</th>
        </tr>

        {% for record in records %}
        <tr>
            <td>{{ record[0] }}</td>
            <td>{{ record[1] }}</td>
            <td>{{ record[2] }}</td>
        </tr>
        {% endfor %}
    </table>

    {% else %}
        <p>No custody records found.</p>
    {% endif %}

    <br><br>

    <a href="/">
        <button type="button">Upload Another File</button>
    </a>

</body>
</html>
